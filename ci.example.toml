# cwld ci serve --config ci.example.toml   (the deployment, nixci, writes the real file)
# The read-scope forge credential is NOT here: it is the systemd credential `mint`
# (CREDENTIALS_DIRECTORY/mint) of the unit that runs `cwld ci serve`.
state_dir = "/var/lib/cwld-ci"

[forge]
api = "https://forge.example/api/v1"
runner_url = "https://forge.example/"
runner_version = "v13.1.0"

[cadence]            # the one polling exception: Forgejo has no "job waiting" push
poll_ms = 1500       # while work was seen in the last minute
idle_ms = 4000       # otherwise; nothing is asked while every slot is busy

[[pool]]
label = "linux"
kind = "host"        # a transient unit per job, cgroup.kill at the end
claim_mib = 2048
pickup_s = 20
runner = "/run/current-system/sw/bin/forgejo-runner"
template = "/etc/cwld-ci/runner.json"
run_as = "forgejo-runner"      # User= of every job unit; the job directories are handed to it
properties = ["Delegate=yes", "ProtectProc=invisible", "MemoryMax=infinity"]
# the job's environment, one declaration for every slot; {credentials} is the job unit's own credentials directory
environment = { HOME = "/var/lib/forgejo-runner", AWS_SHARED_CREDENTIALS_FILE = "{credentials}/sccache-aws" }
slots = [
  { id = "0", name = "srv-0", environment = { SCCACHE_SERVER_PORT = "4230" } },
  { id = "1", name = "srv-1", environment = { SCCACHE_SERVER_PORT = "4231" } },
]
