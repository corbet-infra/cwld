# Dependency-license policy: permissive-only. Own crates are LGPL-3.0-only WITH
# LGPL-3.0-linking-exception and get a crate-specific exception.
[graph]
all-features = true
targets = [{ triple = "x86_64-unknown-linux-gnu" }, { triple = "aarch64-unknown-linux-gnu" }]

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
exceptions = [
  { crate = "cdct", allow = ["LGPL-3.0-only WITH LGPL-3.0-linking-exception"] },
  { crate = "cdrv", allow = ["LGPL-3.0-only WITH LGPL-3.0-linking-exception"] },
  { crate = "cwld", allow = ["LGPL-3.0-only WITH LGPL-3.0-linking-exception"] },
]

[advisories]
version = 2
yanked = "deny"
