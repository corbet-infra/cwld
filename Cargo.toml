[package]
name = "cwld"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "The workload runtime: classes, lifecycle and plan execution for VMs, containers and jails"
repository = "https://git.corbet.ch/corbet-infra/cwld"

[lib]
name = "cwld"
path = "src/lib.rs"

[[bin]]
name = "cwld"
path = "src/main.rs"

[features]
default = []
# The Linux host drivers: `cwld follow` executes the conductor's plans through
# `clnx`. Off by default, so the runtime and its tests build on any platform.
clnx = ["dep:clnx"]

[dependencies]
clnx = { git = "https://git.corbet.ch/corbet-infra/clnx.git", branch = "main", optional = true }
cdct = { git = "https://git.corbet.ch/corbet-infra/cdct.git", branch = "main" }
cdrv = { git = "https://git.corbet.ch/corbet-infra/cdrv.git", branch = "main" }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[lints.rust]
unsafe_code = "forbid"
